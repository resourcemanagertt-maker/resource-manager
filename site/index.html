:root{
  /* a stock-room ledger: near-white paper, charcoal ink, the school's blue for the one main action, a highlighter yellow for "look at this" */
  --paper:#fbfbf9; --ink:#16181d; --muted:#5b606b; --line:#dcdee3; --line-strong:#8a8f9c; --wash:#f0f1f4;
  --brand:#0113a1; --mark:#f7f856; --alert:#a4120b;
  --surface:#fff; --on-brand:#fff; --on-mark:#16181d; --scrim:rgba(22,24,29,.5);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;   /* one spacing scale */
  --r:4px; --r-sheet:12px;                                           /* one corner radius (and the bottom sheet) */
  --font:'Atkinson Hyperlegible Next','Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
:root{color-scheme:light}
html{background:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --paper:#15171c; --ink:#eceef2; --muted:#a2a8b5; --line:#2e323b; --line-strong:#5b616e; --wash:#232730;
  --brand:#8d9cff; --alert:#ff8a80; --surface:#1d2027; --on-brand:#0b1260; --scrim:rgba(0,0,0,.65);}}
:root[data-theme=dark]{color-scheme:dark;
  --paper:#15171c; --ink:#eceef2; --muted:#a2a8b5; --line:#2e323b; --line-strong:#5b616e; --wash:#232730;
  --brand:#8d9cff; --alert:#ff8a80; --surface:#1d2027; --on-brand:#0b1260; --scrim:rgba(0,0,0,.65);}
@media print{:root{color-scheme:light;--paper:#fbfbf9;--ink:#16181d;--muted:#5b606b;--line:#dcdee3;--line-strong:#8a8f9c;--wash:#f0f1f4;--brand:#0113a1;--alert:#a4120b;--surface:#fff}}
html[data-text="1"] #app,html[data-text="1"] #nav,html[data-text="1"] #sheet,html[data-text="1"] #toast,html[data-text="1"] #banner{zoom:1.15}
html[data-text="2"] #app,html[data-text="2"] #nav,html[data-text="2"] #sheet,html[data-text="2"] #toast,html[data-text="2"] #banner{zoom:1.3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#banner,#app{max-width:560px;margin:0 auto}
#app{padding:var(--s2) var(--s4) calc(104px + var(--stripH,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:48px;margin-bottom:var(--s1)}
.org{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2);min-width:0;flex:1 1 0}
.topr .me{flex:0 1 auto;min-width:0;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{flex:none;white-space:nowrap}
@media (max-width:420px){html[data-text] .adminpill span,.adminpill.tight span{display:none}html[data-text] .adminpill,.adminpill.tight{padding:0;width:44px;justify-content:center}}
@media (max-width:340px){.adminpill span{display:none}.adminpill{padding:0;width:44px;justify-content:center}}
.adminpill{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 var(--s3);border:1.5px solid var(--ink);border-radius:999px;background:var(--mark);color:var(--on-mark);font-size:14px;font-weight:700}
.adminpill svg{width:16px;height:16px}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s4);padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface)}
.selcount{font-weight:600;font-size:15px}
.selact{display:flex;gap:var(--s2)}
.qrpage .addbar{background:linear-gradient(to top,var(--paper) 78%,transparent);margin-top:0;padding-top:var(--s4)}
.chk{display:flex;align-items:center;gap:var(--s3);min-height:44px;margin-top:var(--s3);font-size:15px}
.chk{position:relative}
.chk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;font-size:16px}
.chk .box{flex:none;display:grid;place-items:center;width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;background:var(--surface)}
.chk input:checked + .box{background:var(--brand);border-color:var(--brand)}
.chk input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--on-brand);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible + .box{outline:3px solid var(--brand);outline-offset:2px}
.me{font-size:14px;font-weight:600;min-height:44px;padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:var(--s2);font-size:17px;letter-spacing:-.01em}
.brand svg{border-radius:7px;flex:none}
.search input::placeholder{font-size:16px}
.back{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 var(--s3) 0 0;font-weight:600}
.back svg{width:22px;height:22px}
.notice{margin:var(--s2) var(--s4) 0;padding:var(--s2) var(--s3);border-radius:var(--r);background:var(--mark);color:var(--on-mark);font-size:14px;display:flex;align-items:center;gap:var(--s3);justify-content:space-between}
.notice button{font-weight:700;text-decoration:underline;white-space:nowrap;min-height:44px;padding:0 var(--s1)}
@media (prefers-reduced-motion:no-preference){
  @keyframes dockPulse{0%{transform:scale(1)}35%{transform:scale(1.03);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 35%,transparent)}100%{transform:scale(1)}}
  .notice.pulse{animation:dockPulse .5s ease-out}
}

.hero{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:var(--s3) 0 var(--s4)}
h1.title{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:var(--s1) 0 var(--s1)}
.sub{color:var(--muted);font-size:16px;margin-bottom:var(--s4)}
.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:var(--s5) 0 var(--s2)}
.hint{color:var(--muted);font-size:14px;margin-top:var(--s3)}
.muted{color:var(--muted)}

.search{position:relative}
.search svg.ico{position:absolute;left:var(--s4);top:18px;width:22px;height:22px;color:var(--ink);pointer-events:none}
.search input{width:100%;height:58px;border:2px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:0 52px 0 48px;font-size:19px;outline:0;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--brand)}
.search .clear{position:absolute;right:var(--s1);top:var(--s1);width:48px;height:48px;display:grid;place-items:center;color:var(--ink)}
.search .clear svg{width:20px;height:20px}

/* by type: a ledger index, not tiles */
.cats{border-top:1px solid var(--ink)}
.cat{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);width:100%;min-height:48px;padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.cat small{color:var(--muted);font-size:15px;font-weight:400}
.pillx{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s3);margin:var(--s3) 0 var(--s1);border:1px solid var(--ink);border-radius:var(--r);font-size:14px;font-weight:600}
.pillx svg{width:14px;height:14px}

.count{color:var(--muted);font-size:14px;margin:var(--s4) 0 var(--s2)}
/* lists are ruled rows: a rule on top, hairlines between, no boxes */
.list{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.card{border-top:1px solid var(--ink)}
.list > .card,.list .card{border-top:0}
.item{display:flex;gap:var(--s3);padding:var(--s4) 0;width:100%;align-items:flex-start;border-bottom:1px solid var(--line)}
.item .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:var(--s1)}
.name{font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:break-word}
.alt{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:14px;color:var(--muted);overflow-wrap:break-word}
.line b{color:var(--ink)}
.places{display:flex;flex-wrap:wrap;column-gap:var(--s3);font-size:14px;color:var(--muted);line-height:1.7}
.pl{white-space:nowrap}
.pl b{font-weight:700;color:var(--ink)}
.pl.mine{color:var(--ink);font-weight:600}
.pl.low b{font-weight:800;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px;text-underline-offset:2px}
.tot{flex:none;display:flex;flex-direction:column;align-items:flex-end;min-width:48px;text-align:right}
.tot b{font-size:30px;line-height:1;font-weight:700;letter-spacing:-.02em}
.tot b.word{font-size:20px;line-height:1.2;letter-spacing:0}
.tot small{font-size:12px;color:var(--muted);margin-top:var(--s1)}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:1px var(--s2);border-radius:2px;white-space:nowrap;margin-right:var(--s1)}
.badge.low{background:var(--mark);color:var(--on-mark)}
.badge.warn{border:1px solid var(--ink);color:var(--ink)}
.badge.ok{color:var(--muted);font-weight:400;padding-left:0}
.badge.plain{background:var(--wash);color:var(--muted)}
.badge.need{background:color-mix(in srgb,var(--mark) 42%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mark) 75%,var(--ink) 20%);border-radius:999px;padding:1px var(--s2);font-weight:600;margin-bottom:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.need{background:color-mix(in srgb,var(--mark) 20%,var(--surface))}}
:root[data-theme="dark"] .badge.need{background:color-mix(in srgb,var(--mark) 20%,var(--surface))}
.cat{position:relative}
/* a photo only appears when there is one; it fades in when it has arrived, so nothing jumps */
.tile img{opacity:0;transition:opacity .2s ease-out}
.tile img.ld{opacity:1}
.tile{position:relative;flex:none;width:52px;height:52px;border-radius:var(--r);background:var(--wash);display:grid;place-items:center;overflow:hidden}
.tile .emo{font-size:28px;line-height:1}
.tile.big .emo{font-size:46px}
.cat .emo{font-size:24px;flex:none;width:32px;text-align:center}
.cat .lbl2{flex:1;min-width:0}
.cat{align-items:center;justify-content:flex-start}
.cat small{margin-left:auto}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.big{width:96px;height:96px;aspect-ratio:1/1}

.after{margin-top:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}

.empty{padding:var(--s5) 0;text-align:left;border-top:1px solid var(--ink)}

.empty p{color:var(--muted);font-size:16px;margin-bottom:var(--s4)}

/* buttons: one height, one radius. Solid blue is only ever the one main action. */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:52px;padding:var(--s3) var(--s4);border:1.5px solid var(--ink);border-radius:var(--r);background:transparent;font-weight:600;text-align:center;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{cursor:default}
.btn + .btn{margin-top:var(--s2)}

.headcard{display:flex;gap:var(--s4);align-items:flex-start;margin:var(--s1) 0 var(--s4)}
.headcard .name{font-size:28px;line-height:1.15;letter-spacing:-.01em}
.place{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s2);border-bottom:1px solid var(--line)}
.place .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
button.place.on{background:var(--wash)}
.place.on .dot{border:6px solid var(--ink)}
.place .where{flex:1;min-width:0;font-size:16px}
.place .where small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.place .qty{font-weight:700;font-size:26px;line-height:1;white-space:nowrap;text-align:right;letter-spacing:-.02em}
.place .qty small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:var(--s1);letter-spacing:0}
.place .qty.low *{color:var(--on-mark)}
.place .qty.low{background:var(--mark);color:var(--on-mark);padding:2px var(--s2);border-radius:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.two .btn{margin-top:0}
/* the four levels: one joined strip */
.levels{display:grid;grid-template-columns:repeat(4,1fr);margin-top:var(--s4)}
.lvl{min-height:60px;padding:var(--s2) var(--s1);border:1.5px solid var(--ink);background:var(--surface);font-weight:600;font-size:16px;text-align:center;margin-left:-1.5px}
.lvl:first-child{margin-left:0;border-radius:var(--r) 0 0 var(--r)}
.lvl:last-child{border-radius:0 var(--r) var(--r) 0}
.lvl.on{background:var(--ink);color:var(--paper)}
.lvl.lv0.on,.lvl.lv1.on{background:var(--mark);color:var(--on-mark)}
.cline.lvrow{flex-wrap:wrap}
.cline.lvrow .levels{width:100%;margin-top:var(--s1)}
.cline.lvrow .lvl{min-height:46px;font-size:14px}
.lbl.off{opacity:.35}
.lbl .lk{position:absolute;inset:0;width:100%;z-index:1}
.lbl .lk i{position:absolute;top:var(--s2);right:var(--s2);width:24px;height:24px;border:2px solid #5b606b;border-radius:4px;background:#fff}
.lbl:not(.off) .lk i{background:#0113a1;border-color:#0113a1}
.lbl:not(.off) .lk i::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
@media print{.lbl.off{display:none!important}.lbl .lk{display:none}}
.lbls{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.lbl{position:relative;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);border:1px dashed #8a8f9c;background:#fff;color:#16181d;--ink:#16181d;--muted:#5b606b;--surface:#fff;break-inside:avoid}
.lbl .qr svg{display:block;width:100%;height:auto}
.lbl .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl .lt b{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.lbl .lt span,.lbl .lt small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.brow{padding:var(--s4) 0;display:flex;flex-direction:column;gap:var(--s2);border-top:0;border-bottom:1px solid var(--line)}
.brow .help{margin:0}
.isbnline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2)}
.isbnline[hidden]{display:none}
.isbnline .btn,.isbnline .btn + .btn{width:auto;min-width:92px;margin:0}
.brow.tline{padding:var(--s3) var(--s4);gap:var(--s2);min-width:0}
.brow.tline .inp{min-width:0;width:100%}
.rowtools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.rowtools .stepper{flex:1 1 150px;min-width:0}
.rowtools .chip{flex:none}
.addbar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 92px + var(--stripH,0px));z-index:5;margin-top:var(--s4);padding:var(--s2) 0}
.addbar .btn{margin:0}
.needbox{border:2px solid var(--mark);background:var(--surface);border-radius:var(--r);padding:var(--s3) var(--s4);margin:var(--s3) 0}
.needbox h2{margin:0 0 var(--s2);font-size:18px}
.needbox .btn{margin-top:var(--s3)}
.bq{display:flex;align-items:center;gap:var(--s3)}
.bq .stepper{flex:1}
@media print{
  .noprint,#nav,#banner,.top,#toast,#sheet{display:none!important}
  body{background:#fff}
  #app{max-width:none;padding:0}
  .lbls{grid-template-columns:repeat(4,1fr);gap:0;margin:0}
  .lbl{border:1px dashed #888;padding:5mm}
}

.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;min-height:52px;padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:16px}

.hist{font-size:14px;padding:var(--s3) 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}

.lab{display:block;font-size:14px;font-weight:600;margin:var(--s4) 0 var(--s2)}

.inp{width:100%;min-height:52px;padding:var(--s3) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);font-size:17px;outline:0;-webkit-appearance:none;appearance:none}

.stepper{display:flex;align-items:stretch;gap:var(--s2)}

.qtyunit{display:grid;grid-template-columns:1fr 112px;gap:var(--s2);align-items:end}
details{margin-top:var(--s4);border-top:1px solid var(--ink)}
summary{min-height:52px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:24px;font-weight:400}
details[open] summary::after{content:"–"}
.similar{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r);background:var(--mark);color:var(--on-mark);font-size:15px}
.similar .list{margin-top:var(--s2);background:var(--paper);padding:0 var(--s3);border-radius:var(--r)}
.photorow{display:grid;gap:var(--s3);justify-items:stretch}
#f-thumb:empty{display:none}

.cline{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.cline .cname{flex:1;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.cline .cname small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.cline .stepper{gap:var(--s1);margin-left:auto}
html[data-text] .search input{font-size:16px}
.cline .stepper button{width:44px;min-height:44px;font-size:24px}
.cline .stepper .num{width:56px;flex:none;font-size:20px}
.cline{flex-wrap:wrap}
.pickrow{position:relative;padding-left:44px}
.pickrow .pk{position:absolute;left:var(--s3);top:50%;margin-top:-12px;width:24px;height:24px;border:2px solid var(--brand);border-radius:4px;background:var(--brand)}
.pickrow .pk::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--on-brand);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pickrow.off .pk{background:var(--surface);border-color:var(--line-strong)}
.pickrow.off .pk::after{display:none}

.cline .tk{flex:1 1 150px;display:flex;align-items:center;gap:var(--s2);text-align:left;min-height:44px}

.prog{font-size:14px;font-weight:600;margin:0 0 var(--s2)}

.cline.changed{background:var(--mark);color:var(--on-mark);margin:0 calc(-1 * var(--s2));padding-left:var(--s2);padding-right:var(--s2)}

.savebar{position:fixed;left:0;right:0;bottom:calc(65px + var(--stripH,0px));z-index:5;padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,transparent)}

.linkbtn{color:var(--brand-ink,var(--ink));text-decoration:underline;font-weight:600;min-height:44px;padding:0 var(--s2)}

.typenote .ii{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;margin-top:1px}
#edit-drift{margin:0 0 var(--s4)}
.note + #roomlist{margin-top:var(--s3)}
/* v29: launch animation: three blocks fall into place, the last one tilts, over about a second */
#launch{display:none}
#launch.go{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--paper);pointer-events:none;animation:lfade .15s 1.4s forwards}
#launch svg{width:128px;height:128px;overflow:visible}
#launch .blk{transform-box:fill-box;transform-origin:center}
#launch.go .b1{animation:ldrop .38s .05s cubic-bezier(.3,.7,.4,1) both}
#launch.go .b2{animation:ldrop .38s .25s cubic-bezier(.3,.7,.4,1) both}
#launch.go .b3{animation:ldrop3 .42s .45s cubic-bezier(.3,.7,.4,1) both}
#launch.go .st1{animation:lstreak .3s .05s ease-out both}
#launch.go .st2{animation:lstreak .3s .25s ease-out both}
#launch .dot{transform-box:fill-box;transform-origin:center}
#launch.go .dot{animation:ldot .22s .78s ease-out both}
#launch.go .tick{stroke-dasharray:20;animation:ltick .25s .85s ease-out both}
@keyframes ldrop{0%{transform:translateY(-30px);opacity:0}55%{opacity:1}78%{transform:translateY(2px) scale(1.05,.93)}100%{transform:none;opacity:1}}
@keyframes ldrop3{0%{transform:translateY(-38px) rotate(-18deg);opacity:0}55%{opacity:1}80%{transform:translateY(1px) rotate(2deg)}100%{transform:none;opacity:1}}
@keyframes lstreak{0%{opacity:0;transform:translateY(-10px)}35%{opacity:.5}100%{opacity:0;transform:translateY(8px)}}
@keyframes ldot{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes ltick{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
@keyframes lfade{to{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .skel{animation:skelpulse 2.2s ease-in-out infinite;background:var(--sk1)}
  #launch.go{animation:lfade .2s .5s forwards}
  #launch.go *{animation:none!important}
}

.place{flex-wrap:wrap;align-items:flex-start}

.place .qty{margin-left:auto}

.tilebtn::after{content:"📷";position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;display:grid;place-items:center;font-size:15px;background:var(--surface);border:1px solid var(--line-strong,rgba(0,0,0,.3));border-radius:50%}

.list .item .name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        }

        }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

      mode = mode || 'Byte';

        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :

      }

      _dataList.push(newData);
      _dataCache = null;
    };

      }

      return _moduleCount;

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;

            break;
          }

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

          qrHtml += '"/>';

      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

function spareOf(it) {
  return (S.gmap[RMSearch.norm(it.name)] || { rows: [] }).rows.filter(function (r) {

// the list as a WhatsApp message: what is low, who has spare, and what is broken
function shoppingText(lows, broken, scopeLabel) {
  var day = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  var lines = [tl('Running low at {where} ({date}):', { where: scopeLabel, date: day })];
  lows.slice(0, 25).forEach(function (it) {
    var spare = spareOf(it);
    lines.push('• ' + it.name + ' (' + it.centre + '): ' +
      (isLevel(it) ? LEVEL_LABELS[it.qty] : tl('{amount} left (needs {min})', { amount: amount(it.qty, it.unit), min: it.min })) +
      (spare.length ? '. ' + spare.map(function (r) { return tl('{centre} has {amount}', { centre: r.centre, amount: qtyText(r) }); }).join(', ') : ''));
  });
  if (lows.length > 25) lines.push(tl('…and {n} more. Open the app for the rest.', { n: lows.length - 25 }));

    broken.slice(0, 10).forEach(function (it) { lines.push('• ' + it.name + ' (' + it.centre + '): ' + STATUS_LABEL[it.status].toLowerCase()); });

function restoreCheck(v) {

  if (!d) return;
  Object.keys(d.vals || {}).forEach(function (id) {
    var el = byIdEl('c-' + id);

    if (el.type === 'hidden') { var b = document.querySelector('[data-act=countLevel][data-for="c-' + id + '"][data-val="' + d.vals[id] + '"]'); if (b) b.click(); }
    else el.value = d.vals[id];

function countChanges() {
  var out = [], bad = false;
  Object.keys(F.was || {}).forEach(function (id) {
    var el = byIdEl('c-' + id);
    if (!el) return;
    var n = parseQty(el.value), line = el.closest('.cline');
    if (isNaN(n)) { bad = true; return; }
    var changed = n !== F.was[id];
    line.classList.toggle('changed', changed);
    if (changed) line.classList.add('ticked');
    var lvl = isLevel(S.byId[id]), said = function (x) { return lvl ? LEVEL_LABELS[x] : x; };
    $('.tkt small', line).textContent = changed ? tl('was {a}, now {b}', { a: said(F.was[id]), b: said(n) }) : (lvl ? '' : (S.byId[id] || {}).unit || '');
    if (changed) out.push({ id: id, delta: n - F.was[id] });
  });
  var all = Object.keys(F.was || {}).length, done = document.querySelectorAll('.cline.ticked').length, pr = byIdEl('c-prog');
  if (pr) { pr.textContent = tl('{n} of {total} confirmed', { n: done, total: all }); byIdEl('c-bar').style.width = (all ? Math.round(100 * done / all) : 0) + '%'; }
  var cv = cur();
  if (cv.name === 'countList') {
    var key = cv.centre + '|' + cv.loc, vals = {}, ticks = [];
    Object.keys(F.was || {}).forEach(function (id) { var el = byIdEl('c-' + id); if (el && el.value !== '' && parseQty(el.value) !== F.was[id]) vals[id] = parseQty(el.value); });
    [].forEach.call(document.querySelectorAll('.cline.ticked'), function (l) { ticks.push(l.dataset.row); });
    (S.checkDraft || (S.checkDraft = {}))[key] = (Object.keys(vals).length || ticks.length) ? { vals: vals, ticks: ticks } : undefined;
  }
  var btn = byIdEl('c-go');
  if (btn) {
    btn.disabled = bad;
    btn.textContent = bad ? tl('Fill in every number') : out.length ? tl('Save ({n} changed)', { n: out.length }) : tl('Nothing changed, save');
  }
  return bad ? null : out;
}

function vRooms(v) {

    if (it.centre !== centre || isReceivedRoom(it.loc)) return;
    if (!places[it.loc]) { places[it.loc] = { n: 0, oldest: Infinity }; names.push(it.loc); }
