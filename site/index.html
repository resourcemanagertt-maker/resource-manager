:root{
  /* a stock-room ledger: near-white paper, charcoal ink, the school's blue for the one main action, a highlighter yellow for "look at this" */
  --paper:#fbfbf9; --ink:#16181d; --muted:#5b606b; --line:#dcdee3; --line-strong:#8a8f9c; --wash:#f0f1f4;
  --brand:#0113a1; --mark:#f7f856; --alert:#a4120b;
  --surface:#fff; --on-brand:#fff; --on-mark:#16181d; --scrim:rgba(22,24,29,.5);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;   /* one spacing scale */
  --r:4px; --r-sheet:12px;                                           /* one corner radius (and the bottom sheet) */
  --font:'Atkinson Hyperlegible Next','Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --paper:#15171c; --ink:#eceef2; --muted:#a2a8b5; --line:#2e323b; --line-strong:#5b616e; --wash:#232730;
  --brand:#8d9cff; --alert:#ff8a80; --surface:#1d2027; --on-brand:#0b1260; --scrim:rgba(0,0,0,.65);}}
:root[data-theme=dark]{color-scheme:dark;
  --paper:#15171c; --ink:#eceef2; --muted:#a2a8b5; --line:#2e323b; --line-strong:#5b616e; --wash:#232730;
  --brand:#8d9cff; --alert:#ff8a80; --surface:#1d2027; --on-brand:#0b1260; --scrim:rgba(0,0,0,.65);}
@media print{:root{color-scheme:light;--paper:#fbfbf9;--ink:#16181d;--muted:#5b606b;--line:#dcdee3;--line-strong:#8a8f9c;--wash:#f0f1f4;--brand:#0113a1;--alert:#a4120b;--surface:#fff}}
html[data-text="1"] #app,html[data-text="1"] #nav,html[data-text="1"] #sheet,html[data-text="1"] #toast,html[data-text="1"] #banner{zoom:1.15}
html[data-text="2"] #app,html[data-text="2"] #nav,html[data-text="2"] #sheet,html[data-text="2"] #toast,html[data-text="2"] #banner{zoom:1.3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#banner,#app{max-width:560px;margin:0 auto}
#app{padding:var(--s2) var(--s4) 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:48px;margin-bottom:var(--s1)}
.org{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{font-size:14px;font-weight:600;min-height:44px;padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:var(--s2);font-size:17px;letter-spacing:-.01em}
.brand svg{border-radius:7px;flex:none}
.search input::placeholder{font-size:16px}
.back{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 var(--s3) 0 0;font-weight:600}
.back svg{width:22px;height:22px}
.notice{margin:var(--s2) var(--s4) 0;padding:var(--s2) var(--s3);border-radius:var(--r);background:var(--mark);color:var(--on-mark);font-size:14px;display:flex;align-items:center;gap:var(--s3);justify-content:space-between}
.notice button{font-weight:700;text-decoration:underline;white-space:nowrap;min-height:44px;padding:0 var(--s1)}

.hero{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:var(--s3) 0 var(--s4)}
h1.title{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:var(--s1) 0 var(--s1)}
.sub{color:var(--muted);font-size:16px;margin-bottom:var(--s4)}
.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:var(--s5) 0 var(--s2)}
.hint{color:var(--muted);font-size:14px;margin-top:var(--s3)}
.muted{color:var(--muted)}

.search{position:relative}
.search svg.ico{position:absolute;left:var(--s4);top:18px;width:22px;height:22px;color:var(--ink);pointer-events:none}
.search input{width:100%;height:58px;border:2px solid var(--ink);border-radius:var(--r);background:var(--surface);padding:0 52px 0 48px;font-size:19px;outline:0;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--brand)}
.search .clear{position:absolute;right:var(--s1);top:var(--s1);width:48px;height:48px;display:grid;place-items:center;color:var(--ink)}
.search .clear svg{width:20px;height:20px}

/* by type: a ledger index, not tiles */
.cats{border-top:1px solid var(--ink)}
.cat{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);width:100%;min-height:48px;padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.cat small{color:var(--muted);font-size:15px;font-weight:400}
.pillx{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s3);margin:var(--s3) 0 var(--s1);border:1px solid var(--ink);border-radius:var(--r);font-size:14px;font-weight:600}
.pillx svg{width:14px;height:14px}

.count{color:var(--muted);font-size:14px;margin:var(--s4) 0 var(--s2)}
/* lists are ruled rows: a rule on top, hairlines between, no boxes */
.list{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.card{border-top:1px solid var(--ink)}
.list > .card,.list .card{border-top:0}
.item{display:flex;gap:var(--s3);padding:var(--s4) 0;width:100%;align-items:flex-start;border-bottom:1px solid var(--line)}
.item .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:var(--s1)}
.name{font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.alt{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.line b{color:var(--ink)}
.places{display:flex;flex-wrap:wrap;column-gap:var(--s3);font-size:14px;color:var(--muted);line-height:1.7}
.pl{white-space:nowrap}
.pl b{font-weight:700;color:var(--ink)}
.pl.mine{color:var(--ink);font-weight:600}
.pl.low{background:var(--mark);color:var(--on-mark);padding:1px var(--s1);border-radius:2px}
.tot{flex:none;display:flex;flex-direction:column;align-items:flex-end;min-width:48px;text-align:right}
.tot b{font-size:30px;line-height:1;font-weight:700;letter-spacing:-.02em}
.tot b.word{font-size:20px;line-height:1.2;letter-spacing:0}
.tot small{font-size:12px;color:var(--muted);margin-top:var(--s1)}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:1px var(--s2);border-radius:2px;white-space:nowrap;margin-right:var(--s1)}
.badge.low{background:var(--mark);color:var(--on-mark)}
.badge.warn{border:1px solid var(--ink);color:var(--ink)}
.badge.ok{color:var(--muted);font-weight:400;padding-left:0}
.badge.plain{background:var(--wash);color:var(--muted)}
/* a photo only appears when there is one */
.tile{position:relative;flex:none;width:52px;height:52px;border-radius:var(--r);background:var(--wash);display:grid;place-items:center;overflow:hidden}
.tile .emo{font-size:28px;line-height:1}
.tile.big .emo{font-size:46px}
.cat .emo{font-size:24px;flex:none;width:32px;text-align:center}
.cat .lbl2{flex:1;min-width:0}
.cat{align-items:center;justify-content:flex-start}
.cat small{margin-left:auto}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.big{width:96px;height:96px}

.after{margin-top:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}
.after p{color:var(--muted);font-size:14px}
.empty{padding:var(--s5) 0;text-align:left;border-top:1px solid var(--ink)}
.empty h2{font-size:20px;line-height:1.25;margin-bottom:var(--s2);overflow-wrap:anywhere}
.empty p{color:var(--muted);font-size:16px;margin-bottom:var(--s4)}

/* buttons: one height, one radius. Solid blue is only ever the one main action. */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:52px;padding:var(--s3) var(--s4);border:1.5px solid var(--ink);border-radius:var(--r);background:transparent;font-weight:600;text-align:center;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.4;cursor:default}
.btn + .btn{margin-top:var(--s2)}

.headcard{display:flex;gap:var(--s4);align-items:flex-start;margin:var(--s1) 0 var(--s4)}
.headcard .name{font-size:28px;line-height:1.15;letter-spacing:-.01em}
.place{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s2);border-bottom:1px solid var(--line)}
.place .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.place.on{background:var(--wash)}
.place.on .dot{border:6px solid var(--ink)}
.place .where{flex:1;min-width:0;font-size:16px}
.place .where small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.place .qty{font-weight:700;font-size:26px;line-height:1;white-space:nowrap;text-align:right;letter-spacing:-.02em}
.place .qty small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:var(--s1);letter-spacing:0}
.place .qty.low *{color:var(--on-mark)}
.place .qty.low{background:var(--mark);color:var(--on-mark);padding:2px var(--s2);border-radius:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.two .btn{margin-top:0}
/* the four levels: one joined strip */
.levels{display:grid;grid-template-columns:repeat(4,1fr);margin-top:var(--s4)}
.lvl{min-height:60px;padding:var(--s2) var(--s1);border:1.5px solid var(--ink);background:var(--surface);font-weight:600;font-size:16px;text-align:center;margin-left:-1.5px}
.lvl:first-child{margin-left:0;border-radius:var(--r) 0 0 var(--r)}
.lvl:last-child{border-radius:0 var(--r) var(--r) 0}
.lvl.on{background:var(--ink);color:var(--paper)}
.lvl.lv0.on,.lvl.lv1.on{background:var(--mark);color:var(--on-mark)}
.cline.lvrow{flex-wrap:wrap}
.cline.lvrow .levels{width:100%;margin-top:var(--s1)}
.cline.lvrow .lvl{min-height:46px;font-size:14px}
.lbl.off{opacity:.35}
.lbl .lk{position:absolute;inset:0;width:100%;z-index:1}

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

// ---------- where this page is running ----------
// Inside Apps Script (google.script.run exists) the page talks to the script directly. Hosted on a normal website
// (GitHub Pages) it calls the script's web link instead, with no Google cookies, so it works however many Google
// accounts the phone is signed into. The list it talks to is named in the link people are given (…/#b=CODE);
// the code is kept on the phone and removed from the address bar. It is never part of the page's own files.
var HOSTED = !(window.google && google.script && google.script.run);
var BACKEND = { id: '', url: '' };
var WHY = '';   // why the last call to the list failed (shown in small print on the "can't reach" screen)
function parseBackend(text) {
  var t = String(text || '').trim();
  var m = /\/macros\/s\/([\w-]{20,200})/.exec(t) || /[#&?]b=([\w-]{20,200})/.exec(t) || /^([\w-]{20,200})$/.exec(t);
  return m ? m[1] : '';

function setBackend(id) { BACKEND.id = id; BACKEND.url = 'https://script.google.com/macros/s/' + id + '/exec'; }

// ---------- talking to the sheet ----------
function hostedCall(fn, data) {
  return new Promise(function (resolve, reject) {
    var done = false, ctl = window.AbortController ? new AbortController() : null;
    function finish(f, v) { if (done) return; done = true; clearTimeout(timer); f(v); }
    function offline() { return Object.assign(new Error(tl('No signal.')), { network: true }); }
    var timer = setTimeout(function () { if (ctl) ctl.abort(); finish(reject, offline()); }, 45000);
    if (!BACKEND.url) return finish(reject, Object.assign(new Error(tl('This page isn’t connected to a list yet.')), { network: false }));
    fetch(BACKEND.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, data: data || {} }),
      credentials: 'omit', redirect: 'follow', signal: ctl ? ctl.signal : undefined
    }).then(function (r) { if (!r.ok) throw new Error(tl('The list sent back an error ({n}).', { n: r.status })); return r.json().catch(function () { throw new Error(tl('The list sent back something unexpected.')); }); })
      .then(function (r) {
        WHY = '';
        if (r && r.ok) finish(resolve, r);
        else finish(reject, Object.assign(new Error(r && r.error ? tl(r.template || r.error, r.params) : tl('Something went wrong. Try again.')), { data: r || {} }));
      })
      .catch(function (e) { WHY = String(e && e.name ? e.name + ': ' : '') + String(e && e.message || e).slice(0, 140); finish(reject, offline()); });
  });
}
function call(fn, data) {

    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      reject(Object.assign(new Error(tl('No signal.')), { network: true }));
    }, 45000);
    function finish(f, v) { if (done) return; done = true; clearTimeout(timer); f(v); }
    try {
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) finish(resolve, r);
          else finish(reject, Object.assign(new Error(r && r.error ? tl(r.template || r.error, r.params) : tl('Something went wrong. Try again.')), { data: r || {} }));
        })
        .withFailureHandler(function () { finish(reject, Object.assign(new Error(tl('No signal.')), { network: true })); })
        .api(fn, data);
    } catch (e) {
      finish(reject, Object.assign(new Error(tl('No signal.')), { network: true }));
    }

function applyData(d) {
  S.base = d.items || [];
  S.centres = d.centres || [];
  S.categories = d.categories || [];
  S.subtypes = d.subtypes || {};
  S.starter = d.starter || [];
  S.rooms = d.rooms || [];
  S.org = d.org || '';
  S.appUrl = HOSTED ? location.origin + location.pathname : (d.appUrl || S.appUrl);
  S.syncedAt = d.now || Date.now();
  S.loaded = true;

}
function saveData() {

}
function mergeItems(list) {
  (list || []).forEach(function (it) {

// What we show = what the sheet last told us + changes still waiting to be sent
function rebuild() {
  var items = S.base.map(function (o) { return Object.assign({}, o); });
  var map = {};
  items.forEach(function (it) { map[it.id] = it; });
  S.outbox.forEach(function (job) {
    if (job.fn === 'changeStock') {
      var it = map[job.data.itemId];
      if (it) it.qty = Math.max(0, it.qty + job.data.delta);
    } else if (job.fn === 'setLevel') {
      var lv = map[job.data.itemId];
      if (lv) lv.qty = job.data.level;
    } else if (job.fn === 'saveCount') {
      (job.data.counts || []).forEach(function (c) {
        var m = map[c.id];
        if (m) m.qty = Math.max(0, Math.min(isLevel(m) ? 3 : Infinity, m.qty + c.delta));
      });
      items.forEach(function (it) {
        if (it.centre === job.data.centre && it.loc === job.data.location) it.counted = job.at;
      });
    }
  });
  var gm = {};
  items.forEach(function (it) {
    var k = RMSearch.norm(it.name);
    if (!gm[k]) gm[k] = { key: k, name: it.name, rows: [] };
    gm[k].rows.push(it);
  });

    g.dalt = cands.filter(function (c, i) { return i !== best; }).join(', ');
    g.cat = (g.rows.filter(function (r) { return r.cat; })[0] || {}).cat || '';
    g.unit = g.rows[0].unit;
    g.min = Math.max.apply(null, g.rows.map(function (r) { return r.min; }));
    g.total = g.rows.reduce(function (s, r) { return s + (isLevel(r) ? 0 : r.qty); }, 0);

      g.cat + ' ' + g.rows.map(function (r) { return r.centre + ' ' + r.loc + ' ' + r.notes + ' ' + (r.barcode || ''); }).join(' '));

function refresh(manual) {

// Stock changes and counts wait here until the sheet confirms them (so weak signal never loses a change)
function enqueue(fn, data) {
  data.actionId = uid();

  store.set('rm_outbox', S.outbox);
  rebuild();
  flush();
}
var retryTimer = 0;
function flush() {
  if (S.flushing || !S.outbox.length) return;
  S.flushing = true;
  var stale = false;
  (function next() {
    var job = S.outbox[0];
    if (!job) return end();
    call(job.fn, job.data).then(function (res) {
      S.offline = false;
      if (res.replay) stale = true;
      S.outbox.shift();
      store.set('rm_outbox', S.outbox);
      mergeItems(res.items);
      next();
    }).catch(function (e) {
      if (e.network) { S.offline = true; return end(); }
      S.outbox.shift();                       // the sheet said no (e.g. item was removed): drop it and say so
      store.set('rm_outbox', S.outbox);
      stale = true;
      toast(e.message);
      next();
    });
  })();
  function end() {
    S.flushing = false;
    rebuild();
    softRender();
    clearTimeout(retryTimer);
    if (S.outbox.length) retryTimer = setTimeout(flush, 20000);

// who else has plenty of it
function spareOf(it) {

// the list as a WhatsApp message: what is low, who has spare, and what is broken
function shoppingText(lows, broken, scopeLabel) {
  var day = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  var lines = [tl('Running low at {where} ({date}):', { where: scopeLabel, date: day })];
  lows.slice(0, 25).forEach(function (it) {
    var spare = spareOf(it);

      (isLevel(it) ? LEVEL_LABELS[it.qty] : tl('{amount} left, you want at least {min}', { amount: amount(it.qty, it.unit), min: it.min })) +
      (spare.length ? '. ' + spare.map(function (r) { return tl('{centre} has {amount}', { centre: r.centre, amount: qtyText(r) }); }).join(', ') : ''));
  });
  if (lows.length > 25) lines.push(tl('…and {n} more. Open the app for the rest.', { n: lows.length - 25 }));
  if (broken.length) {
    lines.push('', tl('Broken or missing pieces:'));
    broken.slice(0, 10).forEach(function (it) { lines.push('• ' + it.name + ' (' + it.centre + '): ' + STATUS_LABEL[it.status].toLowerCase()); });

}

function countChanges() {
  var out = [], bad = false;
  Object.keys(F.was || {}).forEach(function (id) {
    var el = byIdEl('c-' + id);
    if (!el) return;
    var n = parseQty(el.value), line = el.closest('.cline');
    if (isNaN(n)) { bad = true; return; }
    var changed = n !== F.was[id];
    line.classList.toggle('changed', changed);
    if (changed) line.classList.add('ticked');
    var lvl = isLevel(S.byId[id]), said = function (x) { return lvl ? LEVEL_LABELS[x] : x; };
    $('.tkt small', line).textContent = changed ? tl('was {a}, now {b}', { a: said(F.was[id]), b: said(n) }) : (lvl ? 'level' : (S.byId[id] || {}).unit || '');
    if (changed) out.push({ id: id, delta: n - F.was[id] });
  });
  var all = Object.keys(F.was || {}).length, done = document.querySelectorAll('.cline.ticked').length, pr = byIdEl('c-prog');
  if (pr) { pr.textContent = tl('{n} of {total} checked', { n: done, total: all }); byIdEl('c-bar').style.width = (all ? Math.round(100 * done / all) : 0) + '%'; }
  var btn = byIdEl('c-go');
  if (btn) {
    btn.disabled = bad;
    btn.textContent = bad ? tl('Fill in every number') : out.length ? tl('Save ({n} changed)', { n: out.length }) : tl('All correct — save');
  }
  return bad ? null : out;
}

      if (isbn === null) { r.err = tl('That barcode looks wrong. Check the digits.'); bad = true; return; }
      if (isNaN(q) || q < 1) { r.err = tl('Enter 1 or more.'); bad = true; return; }
      if (!name && !listHasIsbn(isbn)) { r.err = tl('Type a name — this barcode isn’t on the list yet.'); bad = true; return; }
      rows.push({ name: name, isbn: isbn, qty: q });
      map.push(i);
    });
    if (bad) { drawRows(); return formError(tl('Fix the lines in red.')); }
    if (!rows.length) return formError(tl('Add at least one item.'));
    formError('');
    busy(true);
    call('addMany', { centre: F.centre, location: loc, unit: val('f-unit'), cat: F.cat || '', rows: rows, actionId: uid() }).then(function (res) {
      mergeItems(res.items); rebuild();
      if (res.problems && res.problems.length) {
        var errs = {};
        res.problems.forEach(function (p) { errs[map[p.row]] = tl(p.error); });
        // keep only the lines that failed, in their old order, each with its own message
        var failedAt = Object.keys(errs).map(Number).sort(function (a, b) { return a - b; });
        F.rows = failedAt.map(function (i) { var r = F.rows[i]; r.err = errs[i]; return r; });
        drawRows();
        busy(false);
        return formError(tl('Saved {n}. The lines below need fixing.', { n: res.created + res.topped }));
      }
      root('home');
      toast(res.replay ? tl('Already saved.') : (res.topped ? tl('Added {n} new, and more of {m} already on the list.', { n: res.created, m: res.topped }) : (res.created === 1 ? tl('Added 1 new item.') : tl('Added {n} new items.', { n: res.created }))));
    }).catch(failed);

// ---------- listeners ----------
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  // the next tap anywhere puts the last message away, so it never sits on top of a button
  if (!e.target.closest('#toast')) byIdEl('toast').hidden = true;
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName !== 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { S.q = t.value; drawResults(); }
  else if (t.id === 'm-n') { if (M.type === 'move') refreshMove(); else updateStockBtn(); }
  else if (t.id === 'f-name' && !t.readOnly && byIdEl('similar')) { byIdEl('similar').innerHTML = similarAll(t.value); suggestType(t.value.trim()); }
  else if (t.id && t.id.indexOf('c-') === 0) countChanges();
  else if (t.id && /^b-(isbn|name|qty)-\d+$/.test(t.id)) {
    var m = /^b-(isbn|name|qty)-(\d+)$/.exec(t.id);
    if (F.rows && F.rows[m[2]]) F.rows[m[2]][m[1]] = t.value;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'q') e.target.blur();
  if (e.key === 'Enter' && e.target.id === 'm-pin') ACT.pinGo();
  if (e.key === 'Escape' && !byIdEl('sheet').hidden) closeSheet();
});
// a photo that will not load falls back to the Drive thumbnail, then to the picture of its category
document.addEventListener('error', function (e) {
  var t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  if (t.dataset.fb) { var fb = t.dataset.fb; delete t.dataset.fb; t.src = fb; }
  else t.remove();
}, true);
// Barcode scanning: the browser's own reader where there is one (Chrome on Android); otherwise, on the hosted page, a small
// reader (scan/, a WebAssembly build of ZBar) is fetched the first time it is needed. Otherwise the person types the ISBN.
var readerLoad = null;
function addScript(src) {
  return new Promise(function (ok, no) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = function () { no(new Error('could not load ' + src)); };
    document.head.appendChild(s);
  });
}
// (the polyfill script declares a top-level const, so it is reached by name, not through window)
// a 12-megapixel photo is too much to decode quickly on a small phone; bars stay wide enough at 2000 px
function fitForReader(bmp) {
  var max = 2000, big = Math.max(bmp.width, bmp.height);
  if (big <= max) return bmp;
  var k = max / big, c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
function loadReader() {
  if ('BarcodeDetector' in window) return Promise.resolve(window.BarcodeDetector);
  if (!HOSTED) return Promise.reject(new Error('no reader'));
  if (!readerLoad) {
    readerLoad = addScript('scan/zbar-wasm.js').then(function () { return addScript('scan/barcode-polyfill.js'); })
      .then(function () { return barcodeDetectorPolyfill.BarcodeDetectorPolyfill; })
      .catch(function (e) { readerLoad = null; throw e; });
  }
  return readerLoad;
}
byIdEl('scan').addEventListener('change', function () {
  var file = this.files && this.files[0], i = F.scanFor;
  if (SC.photoMode) {
    SC.photoMode = false;
    if (!file) return;
    toast(tl('Reading the barcode…'));
    Promise.all([createImageBitmap(file), loadReader()]).then(function (a) { return new a[1]({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }).detect(fitForReader(a[0])); })
      .then(function (codes) {
        var isbn = anyBarcode(codes && codes[0] && codes[0].rawValue);
        if (!isbn) return toast(tl('Couldn’t read that barcode. Try again, closer and flat.'));
        scanBook(isbn, SC.ctx);
      }).catch(function () { toast(tl('Couldn’t read that barcode. Try again, closer and flat.')); });
    return;
  }
  if (!file || !F.rows || !F.rows[i]) return;
  setRowMsg(i, tl('Reading the barcode…'));
  Promise.all([createImageBitmap(file), loadReader()]).then(function (a) { return new a[1]({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }).detect(fitForReader(a[0])); })
    .then(function (codes) {
      var isbn = anyBarcode(codes && codes[0] && codes[0].rawValue);
      if (!isbn) return setRowMsg(i, tl('Couldn’t read that barcode. Try again, or type the number.'));
      F.rows[i].isbn = isbn;
      var el = byIdEl('b-isbn-' + i);
      if (el) el.value = isbn;
      ACT.isbnLook({ dataset: { i: String(i) } });
    }).catch(function () { setRowMsg(i, tl('Couldn’t read that barcode. Try again, or type the number.')); });
});
byIdEl('file').addEventListener('change', function () {
  var f = this.files && this.files[0];
  if (!f) return;
  shrink(f).then(function (dataUrl) {
    F.photo = dataUrl;
    var th = byIdEl('f-thumb');
    if (th) th.innerHTML = '<span class="tile"><img alt="" src="' + dataUrl + '"></span>';
  }).catch(function () { toast(tl('That photo didn’t work. Try another one.')); });
});
window.addEventListener('online', function () { flush(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Date.now() - S.syncedAt > 120000) refresh();
});

// ---------- start ----------
// a phone that stored a name from an earlier version forgets it
if (S.me && S.me.name !== undefined) { S.me = { centre: S.me.centre }; store.set('rm_me', S.me); }
if (HOSTED) {
  var given = parseBackend(location.hash), known = given || parseBackend(store.get('rm_backend', ''));
  if (given) {
    store.set('rm_backend', given);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* the code stays in the address bar */ }
  }
  if (known) setBackend(known);
  // installable and usable without signal: the page's own files are kept by the browser
  [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icon-192.png']].forEach(function (p) {
    var link = document.createElement('link');
    link.rel = p[0]; link.href = p[1];
    document.head.appendChild(link);
  });
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* works without it */ }); } catch (e) { /* works without it */ }
}
var cached = store.get('rm_data', null);
if (cached && cached.staff) { delete cached.staff; store.set('rm_data', cached); }
if (cached && cached.items) applyData(cached);
render();
refresh();
// a QR sticker opens the app with ?i=ITEM-ID (an item) or ?c=CENTRE&p=PLACE (a shelf to count)
if (HOSTED) {
  try {
    var q = new URLSearchParams(location.search), found = {};
    ['i', 'c', 'p'].forEach(function (k) { if (q.get(k)) found[k] = q.get(k); });
    if (found.i || (found.c && found.p)) {
      pendingLink = found;
      history.replaceState(null, '', location.pathname);   // a reload should not open it again
      applyLink();
    }
  } catch (e) { /* no link support */ }
} else {
  try { google.script.url.getLocation(function (loc) { pendingLink = (loc && loc.parameter) || null; applyLink(); }); } catch (e) { /* no link support */ }
}
})();
