<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource Manager</title>
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#1e1d1a; --muted:#66645d; --line:#dfddd5; --soft:#eceae3;
  --brand:#0113a1; --red:#b3261e; --red-bg:#fbe7e4; --amber:#7a5200; --amber-bg:#fdf0cf;
  --green:#1a6a39; --green-bg:#e4f3e8; --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

#banner,#app{max-width:560px;margin:0 auto}
#app{padding:8px 16px 104px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin-bottom:4px}
.org{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{font-size:14px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 12px 0 0;font-weight:600}
.back svg{width:22px;height:22px}
.notice{margin:8px 16px 0;padding:10px 12px;border-radius:var(--r);background:var(--amber-bg);color:var(--amber);font-size:14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.notice button{font-weight:700;text-decoration:underline;white-space:nowrap;min-height:44px;padding:0 4px}

.hero{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:10px 0 14px}
h1.title{font-size:22px;line-height:1.2;margin:4px 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:14px}
.sec{font-size:15px;font-weight:700;margin:22px 0 8px}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.muted{color:var(--muted)}

.search{position:relative}
.search svg.ico{position:absolute;left:16px;top:18px;width:22px;height:22px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:58px;border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:0 52px 0 48px;font-size:18px;outline:0;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--brand)}
.search .clear{position:absolute;right:6px;top:6px;width:46px;height:46px;display:grid;place-items:center;color:var(--muted)}
.search .clear svg{width:20px;height:20px}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-size:14px;line-height:1.2}
.cat .emo{font-size:22px;flex:none}
.cat small{display:block;color:var(--muted);font-size:12px}
.pillx{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;margin:12px 0 2px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px}
.pillx svg{width:14px;height:14px}

.count{color:var(--muted);font-size:14px;margin:14px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.item{display:flex;gap:12px;padding:12px;width:100%;align-items:flex-start}
.item .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.alt{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.line b{color:var(--ink)}
.places{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}
.pl{font-size:13px;padding:3px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pl b{font-weight:700}
.pl.mine{outline:1.5px solid var(--ink)}
.pl.low{background:var(--red-bg);color:var(--red)}
.pl.low.mine{outline-color:var(--red)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.low{background:var(--red-bg);color:var(--red)}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.plain{background:var(--soft);color:var(--muted)}
.tile{position:relative;flex:none;width:52px;height:52px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.tile .emo{font-size:26px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.big{width:84px;height:84px;border-radius:14px}
.tile.big .emo{font-size:40px}

.after{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.after p{color:var(--muted);font-size:14px}
.empty{padding:18px 16px;text-align:left}
.empty h2{font-size:18px;margin-bottom:6px;overflow-wrap:anywhere}
.empty p{color:var(--muted);font-size:15px;margin-bottom:14px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-weight:600;text-align:center;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:default}
.btn + .btn{margin-top:8px}

.headcard{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.headcard .name{font-size:21px}
.place{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-bottom:1px solid var(--line)}
.place:last-child{border-bottom:0}
.place .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.place.on .dot{border:6px solid var(--brand)}
.place .where{flex:1;min-width:0;font-size:15px}
.place .where small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.place .qty{font-weight:700;font-size:17px;white-space:nowrap;text-align:right}
.place .qty small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.place .qty.low{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .btn{margin-top:0}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.lvl{min-height:64px;padding:8px 4px;border:1px solid #b9b6ac;border-radius:var(--r);background:var(--card);font-weight:600;font-size:15px;text-align:center}
.lvl.on{border-width:2px;border-color:var(--ink)}
.lvl.lv0.on{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.lvl.lv1.on{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.lvl.lv2.on,.lvl.lv3.on{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.cline.lvrow{flex-wrap:wrap}
.cline.lvrow .levels{width:100%;margin-top:2px;gap:6px}
.cline.lvrow .lvl{min-height:46px;font-size:14px}
.lbls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.lbl{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed #b9b6ac;border-radius:10px;background:#fff;break-inside:avoid}
.lbl .qr svg{display:block;width:100%;height:auto}
.lbl .lt{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl .lt b{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.lbl .lt span,.lbl .lt small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.brow{padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.brow .help{margin:0}
.isbnline{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.isbnline .btn{width:auto;min-width:92px}
.bq{display:flex;align-items:center;gap:12px}
.bq .stepper{flex:1}
@media print{
  .noprint,#nav,#banner,.top,#toast,#sheet{display:none!important}
  body{background:#fff}
  #app{max-width:none;padding:0}
  .lbls{grid-template-columns:repeat(4,1fr);gap:0;margin:0}
  .lbl{border:1px dashed #888;border-radius:0;padding:5mm}
}
.big{min-height:84px;flex-direction:column;gap:2px;font-size:16px}
.big .sign{font-size:30px;line-height:1;font-weight:400}
.big.add{background:var(--green-bg);border-color:#bfdcc8;color:var(--green)}
.forwhere{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.note{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--soft);font-size:14px;overflow-wrap:anywhere}
.rows{margin-top:16px}
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:15px}
.rowbtn:last-child{border-bottom:0}
.rowbtn svg{width:18px;height:18px;color:var(--muted);flex:none}
.rowbtn small{display:block;color:var(--muted);font-size:13px}
.hist{font-size:14px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.hist:last-child{border-bottom:0}
.hist small{color:var(--muted)}

.lab{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
.lab i{font-style:normal;font-weight:400;color:var(--muted)}
.inp{width:100%;min-height:52px;padding:12px 14px;border:1px solid #b9b6ac;border-radius:var(--r);background:var(--card);font-size:16px;outline:0;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.inp[readonly]{background:var(--soft);border-color:var(--line)}
textarea.inp{min-height:76px;resize:vertical;line-height:1.35}
.help{font-size:13px;color:var(--muted);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:8px 14px;border:1px solid #b9b6ac;border-radius:999px;background:var(--card);font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{flex:none;width:56px;min-height:56px;border:1px solid #b9b6ac;border-radius:var(--r);background:var(--card);font-size:28px;line-height:1;text-align:center}
.stepper .num{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:700;border:1px solid #b9b6ac;border-radius:var(--r);background:var(--card);outline:0}
.stepper .num:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.qtyunit{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:end}
details{margin-top:18px;border-top:1px solid var(--line)}
summary{min-height:52px;display:flex;align-items:center;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:22px;font-weight:400;color:var(--muted)}
details[open] summary::after{content:"–"}
.similar{margin-top:10px;padding:12px;border-radius:var(--r);background:var(--amber-bg);color:var(--amber);font-size:14px}
.similar .list{margin-top:8px}
.similar .item{color:var(--ink)}
.photorow{display:flex;gap:12px;align-items:center}
.photorow .btn{flex:1}
.formend{margin-top:22px}
.err{color:var(--red);font-size:14px;margin-top:10px}

.cline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.cline .cname{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.cline .cname small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.cline .stepper{gap:4px}
.cline .stepper button{width:44px;min-height:44px;font-size:24px}
.cline .stepper .num{width:56px;flex:none;font-size:18px}
.cline.changed{background:#eef1ff}
.cline.changed .cname small{color:var(--brand)}
.savebar{position:fixed;left:0;right:0;bottom:66px;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar .btn{max-width:528px;margin:0 auto}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;font-size:12px;color:var(--muted);text-align:center}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--ink);font-weight:700}
#nav .n{position:absolute;top:8px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(20,19,16,.45)}
#sheet .panel{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet h2{font-size:20px;margin-bottom:4px}
#sheet .sub{margin-bottom:4px}
#sheet .btn.primary{margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 12px;border:1px solid #b9b6ac;border-radius:var(--r);background:var(--card);margin-top:8px}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.opt.on{border-color:var(--ink)}
.opt.on .dot{border:6px solid var(--ink)}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;width:calc(100% - 32px);max-width:528px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:#fff;font-size:15px}
#toast button{color:#fff;font-weight:700;text-decoration:underline;min-height:44px;padding:0 6px;margin:-8px 0;white-space:nowrap}
.splash{padding:80px 8px;text-align:center;color:var(--muted)}
.splash .btn{max-width:240px;margin:18px auto 0}
.seg{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
@media (min-width:700px){#app{padding-top:20px}.hero{font-size:32px}}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"><div class="splash">Getting the list…</div></div>
<nav id="nav" hidden></nav>
<div id="sheet" hidden><div class="scrim" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden role="status"></div>
<input type="file" accept="image/*" id="file" hidden>
<input type="file" accept="image/*" capture="environment" id="scan" hidden>

<script id="rm-qr">

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {

            } else {

              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

// ISBN checking. Same rules as isbn13_ in Code.gs (a test compares the two): '' = nothing typed, null = wrong,
// otherwise 13 digits (an ISBN-10 is converted, so old and new printings of a book match).
var RMIsbn = (function () {
  function weighted(digits) { return digits.split('').reduce(function (sum, c, i) { return sum + Number(c) * (i % 2 ? 3 : 1); }, 0); }
  function clean(v) {
    var raw = String(v == null ? '' : v).normalize('NFKC').replace(/[\s-]/g, '').toUpperCase();
    if (!raw) return '';
    if (/^\d{13}$/.test(raw)) return /^97[89]/.test(raw) && weighted(raw) % 10 === 0 ? raw : null;

      var sum = raw.split('').reduce(function (t, c, i) { return t + (c === 'X' ? 10 : Number(c)) * (10 - i); }, 0);

      return core + ((10 - weighted(core) % 10) % 10);

  }

  var m = /\/macros\/s\/([\w-]{20,200})/.exec(t) || /[#&?]b=([\w-]{20,200})/.exec(t) || /^([\w-]{20,200})$/.exec(t);
  return m ? m[1] : '';
}
function setBackend(id) { BACKEND.id = id; BACKEND.url = 'https://script.google.com/macros/s/' + id + '/exec'; }

// ---------- talking to the sheet ----------
function hostedCall(fn, data) {
  return new Promise(function (resolve, reject) {
    var done = false, ctl = window.AbortController ? new AbortController() : null;
    function finish(f, v) { if (done) return; done = true; clearTimeout(timer); f(v); }
    function offline() { return Object.assign(new Error('No signal.'), { network: true }); }
    var timer = setTimeout(function () { if (ctl) ctl.abort(); finish(reject, offline()); }, 45000);
    if (!BACKEND.url) return finish(reject, Object.assign(new Error('This page is not connected to a list yet.'), { network: false }));
    fetch(BACKEND.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, data: data || {} }),
      credentials: 'omit', redirect: 'follow', signal: ctl ? ctl.signal : undefined
    }).then(function (r) { if (!r.ok) throw new Error('the list answered with status ' + r.status); return r.json().catch(function () { throw new Error('the list sent something that was not a list'); }); })
      .then(function (r) {
        WHY = '';
        if (r && r.ok) finish(resolve, r);
        else finish(reject, Object.assign(new Error((r && r.error) || 'Something went wrong. Please try again.'), { data: r || {} }));
      })
      .catch(function (e) { WHY = String(e && e.name ? e.name + ': ' : '') + String(e && e.message || e).slice(0, 140); finish(reject, offline()); });
  });
}
function call(fn, data) {
  if (HOSTED) return hostedCall(fn, data);
  return new Promise(function (resolve, reject) {
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      reject(Object.assign(new Error('No signal.'), { network: true }));
    }, 45000);
    function finish(f, v) { if (done) return; done = true; clearTimeout(timer); f(v); }
    try {
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) finish(resolve, r);
          else finish(reject, Object.assign(new Error((r && r.error) || 'Something went wrong. Please try again.'), { data: r || {} }));
        })
        .withFailureHandler(function () { finish(reject, Object.assign(new Error('No signal.'), { network: true })); })
        .api(fn, data);
    } catch (e) {
      finish(reject, Object.assign(new Error('No signal.'), { network: true }));
    }
  });
}

function applyData(d) {
  S.base = d.items || [];
  S.centres = d.centres || [];
  S.categories = d.categories || [];
  S.org = d.org || '';
  S.appUrl = HOSTED ? location.origin + location.pathname : (d.appUrl || S.appUrl);
  S.syncedAt = d.now || Date.now();
  S.loaded = true;
  rebuild();
}
function saveData() {
  store.set('rm_data', { items: S.base, centres: S.centres, categories: S.categories, org: S.org, appUrl: S.appUrl, now: S.syncedAt });
}
function mergeItems(list) {
  (list || []).forEach(function (it) {
    var i = S.base.findIndex(function (b) { return b.id === it.id; });
    if (i >= 0) S.base[i] = it; else S.base.push(it);
  });
  saveData();
}

// What we show = what the sheet last told us + changes still waiting to be sent
function rebuild() {
  var items = S.base.map(function (o) { return Object.assign({}, o); });
  var map = {};
  items.forEach(function (it) { map[it.id] = it; });
  S.outbox.forEach(function (job) {
    if (job.fn === 'changeStock') {
      var it = map[job.data.itemId];
      if (it) it.qty = Math.max(0, it.qty + job.data.delta);
    } else if (job.fn === 'setLevel') {
      var lv = map[job.data.itemId];
      if (lv) lv.qty = job.data.level;
    } else if (job.fn === 'saveCount') {
      (job.data.counts || []).forEach(function (c) {
        var m = map[c.id];
        if (m) m.qty = Math.max(0, Math.min(isLevel(m) ? 3 : Infinity, m.qty + c.delta));
      });
      items.forEach(function (it) {
        if (it.centre === job.data.centre && it.loc === job.data.location) it.counted = job.at;
      });
    }
  });
  var gm = {};
  items.forEach(function (it) {
    var k = RMSearch.norm(it.name);
    if (!gm[k]) gm[k] = { key: k, name: it.name, rows: [] };
    gm[k].rows.push(it);
  });
  var order = function (c) { var i = S.centres.indexOf(c); return i < 0 ? 99 : i; };
  S.groups = Object.keys(gm).map(function (k) {
    var g = gm[k], seen = {}, alts = [];
    g.rows.sort(function (a, b) { return order(a.centre) - order(b.centre) || (a.loc < b.loc ? -1 : 1); });
    g.rows.forEach(function (r) {
      String(r.alt || '').split(/[,，、;；]+/).forEach(function (a) {
        a = a.trim();
        var n = RMSearch.norm(a);
        if (n && !seen[n] && n !== k) { seen[n] = 1; alts.push(a); }
      });
    });
    g.alt = alts.join(', ');
    g.cat = (g.rows.filter(function (r) { return r.cat; })[0] || {}).cat || '';
    g.unit = g.rows[0].unit;
    g.min = Math.max.apply(null, g.rows.map(function (r) { return r.min; }));
    g.total = g.rows.reduce(function (s, r) { return s + (isLevel(r) ? 0 : r.qty); }, 0);
    g.levelOnly = g.rows.every(isLevel);
    g.lowest = Math.min.apply(null, g.rows.filter(isLevel).map(function (r) { return r.qty; }));
    g.photoRow = g.rows.filter(function (r) { return r.photo || S.localPhoto[r.id]; })[0] || g.rows[0];
    RMSearch.index(g, g.name + ' ' + g.alt,
      g.cat + ' ' + g.rows.map(function (r) { return r.centre + ' ' + r.loc + ' ' + r.notes; }).join(' '));
    return g;
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  S.items = items;
  S.byId = map;
  S.gmap = gm;
}

function refresh(manual) {
  if (S.refreshing) return;
  S.refreshing = true;
  call('getData', {}).then(function (d) {
    S.offline = false; S.failed = false; S.fresh = true;
    applyData(d);
    saveData();
    if (manual) toast('The list is up to date.');
  }).catch(function (e) {
    S.offline = !!e.network;
    if (!S.loaded) S.failed = true;
    else if (manual) toast(e.network ? 'No signal. Showing the last saved list.' : e.message);
  }).then(function () {
    S.refreshing = false;
    softRender();
    applyLink();
    flush();
  });
}

// Stock changes and counts wait here until the sheet confirms them (so weak signal never loses a change)
function enqueue(fn, data) {
  data.actionId = uid();
  S.outbox.push({ fn: fn, data: data, at: Date.now() });
  store.set('rm_outbox', S.outbox);
  rebuild();
  flush();
}
var retryTimer = 0;
function flush() {
  if (S.flushing || !S.outbox.length) return;
  S.flushing = true;
  var stale = false;
  (function next() {
    var job = S.outbox[0];
    if (!job) return end();
    call(job.fn, job.data).then(function (res) {
      S.offline = false;
      if (res.replay) stale = true;
      S.outbox.shift();
      store.set('rm_outbox', S.outbox);
      mergeItems(res.items);
      next();
    }).catch(function (e) {
      if (e.network) { S.offline = true; return end(); }
      S.outbox.shift();                       // the sheet said no (e.g. item was removed): drop it and say so
      store.set('rm_outbox', S.outbox);
      stale = true;
      toast(e.message);
      next();
    });
  })();
  function end() {
    S.flushing = false;
    rebuild();
    softRender();
    clearTimeout(retryTimer);
    if (S.outbox.length) retryTimer = setTimeout(flush, 20000);
    else if (stale) refresh();
  }
}

// ---------- navigation ----------
var hist = (window.google && google.script && google.script.history) || null;
if (!hist && HOSTED) {
  hist = {
    push: function (state) { history.pushState(state, ''); },
    setChangeHandler: function (fn) { window.addEventListener('popstate', function () { fn(); }); }
  };
}
function go(view, replace) {
  if (replace) S.stack[S.stack.length - 1] = view; else S.stack.push(view);
  try { if (hist && !replace) hist.push({ n: S.stack.length }); } catch (e) { /* back button just leaves the app */ }
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (S.stack.length > 1) S.stack.pop(); else S.stack = [{ name: 'home' }];
  render();
}
function root(name) {
  S.stack = [{ name: name }];
  if (name === 'home') S.q = '';
  render();
  window.scrollTo(0, 0);
}
try {
  // The phone's own back button: close an open sheet, otherwise go up one screen.
  if (hist) hist.setChangeHandler(function () {
    if (!byIdEl('sheet').hidden) { closeSheet(); return; }
    if (S.stack.length > 1) { S.stack.pop(); render(); }
  });
} catch (e) { /* no history support */ }

// ---------- drawing ----------
function vConnect() {
  return '<div style="padding-top:40px"><h1 class="hero">Connect to the list</h1>' +
    '<p class="sub">Open the link your admin sent you. If you only have its long code, paste it here.</p>' +
    '<label class="lab" for="s-link">Link or code</label>' +
    '<input id="s-link" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Link or code">' +
    '<p class="err" id="s-err" hidden></p>' +
    '<button class="btn primary" style="margin-top:14px" data-act="connect">Connect</button></div>';
}
function render() {
  var app = byIdEl('app'), v = cur();
  if (!S.loaded) {
    byIdEl('nav').hidden = true;
    if (HOSTED && !BACKEND.id) { app.innerHTML = vConnect(); return; }
    app.innerHTML = S.failed
      ? '<div class="splash"><p>Can’t reach the list right now.</p><p>Check the internet and try again.</p><button class="btn primary" data-act="refresh">Try again</button>' +
        (HOSTED && WHY ? '<p class="help" style="margin-top:18px">Details: ' + esc(WHY) + '</p>' : '') + '</div>'
      : '<div class="splash">Getting the list…</div>';
    return;
  }
  if (!hasCentre()) v = { name: 'pick' };
  var views = { home: vHome, item: vItem, add: vAdd, request: vRequest, edit: vEdit, low: vLow, count: vCount,
    countList: vCountList, more: vMore, requests: vRequests, admin: vAdmin, pick: vPick, labels: vLabels, bulk: vBulk };
  app.innerHTML = (views[v.name] || vHome)(v);
  drawChrome(v);
  if (v.name === 'home' && window.matchMedia && matchMedia('(pointer:fine)').matches && byIdEl('q')) byIdEl('q').focus();
}
// Refresh what is on screen without wiping something the person is typing
function softRender() {
  var n = cur().name;
  if (!byIdEl('sheet').hidden) return;
  if (S.loaded && hasCentre() && ['add', 'request', 'edit', 'countList', 'bulk'].indexOf(n) >= 0) { drawChrome(cur()); return; }
  if (S.loaded && hasCentre() && n === 'home' && byIdEl('results')) { drawResults(); drawChrome(cur()); return; }
  render();
}
function drawChrome(v) {
  var nav = byIdEl('nav');
  nav.hidden = v.name === 'pick';
  var tab = { home: 'home', item: 'home', add: 'home', request: 'home', edit: 'home', low: 'low', count: 'count',
    countList: 'count', more: 'more', requests: 'more', admin: 'more', labels: 'more', bulk: 'more' }[v.name];
  var lows = S.items.filter(function (it) { return it.centre === myCentre() && low(it); }).length;
  var b = function (to, label, icon, n) {
    return '<button data-act="nav" data-to="' + to + '" class="' + (tab === to ? 'on' : '') + '">' + icon +
      '<span>' + label + '</span>' + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  };
  nav.innerHTML = '<div class="in">' + b('home', 'Find', ICON.find) + b('low', 'Running low', ICON.low, lows) +
    b('count', 'Count', ICON.count) + b('more', 'Me', ICON.more) + '</div>';
  var n = S.outbox.length, msg = '';
  if (n && S.offline) {
    msg = '<div class="notice"><span>' + n + (n === 1 ? ' change is' : ' changes are') +
      ' saved on this phone and will send when there is signal.</span><button data-act="flushNow">Send now</button></div>';
  } else if (S.offline) {
    msg = '<div class="notice"><span>No signal. Showing the list from ' + esc(when(S.syncedAt)) +
      '.</span><button data-act="refresh">Try again</button></div>';
  }
  byIdEl('banner').innerHTML = msg;
}
function top(hasBack) {
  var me = S.me ? '<button class="me" data-act="nav" data-to="more">' + esc(S.me.centre) + '</button>' : '';
  return '<header class="top">' + (hasBack
    ? '<button class="back" data-act="back">' + ICON.back + '<span>Back</span></button>'
    : '<span class="org">' + esc(S.org) + '</span>') + me + '</header>';
}

function photoSrc(it, w) {
  if (!it) return '';
  if (S.localPhoto[it.id]) return S.localPhoto[it.id];
  var p = it.photo || '';
  if (!p) return '';
  var m = /\/d\/([\w-]{10,})/.exec(p) || /[?&]id=([\w-]{10,})/.exec(p);
  if (m) return (window.RM_PHOTO_BASE || 'https://lh3.googleusercontent.com/d/') + m[1] + '=w' + w;
  return /^https:\/\//.test(p) ? p : '';
}
function tile(it, cat, big) {
  var src = photoSrc(it, big ? 600 : 200);
  var m = it && /\/d\/([\w-]{10,})/.exec(it.photo || '');
  return '<span class="tile' + (big ? ' big' : '') + '"><span class="emo">' + (CAT_ICON[cat] || '📦') + '</span>' +
    (src ? '<img alt="" loading="lazy" src="' + esc(src) + '"' +
      (m ? ' data-fb="https://drive.google.com/thumbnail?id=' + esc(m[1]) + '&amp;sz=w' + (big ? 600 : 200) + '"' : '') + '>' : '') +
    '</span>';
}
function badges(it) {
  var out = '';
  if (low(it)) out += '<span class="badge low">Running low</span> ';
  if (STATUS_LABEL[it.status]) out += '<span class="badge warn">' + STATUS_LABEL[it.status] + '</span> ';
  return out;
}

function resultsHtml(v) {

  if (!q && v.cat) {
    var inCat = S.groups.filter(function (g) { return g.cat === v.cat; });
    return '<button class="pillx" data-act="clearCat">' + esc(v.cat) + ' ' + ICON.x + '</button>' +

      '<div class="list">' + inCat.map(card).join('') + '</div>';
  }
  if (!q) {
    var counts = {};

    return '<p class="hint">Try “kertas A4”, “蜡笔” or “scissors”.</p>' +

      S.categories.filter(function (c) { return counts[c]; }).map(function (c) {
        return '<button class="cat" data-act="cat" data-val="' + esc(c) + '"><span class="emo">' + (CAT_ICON[c] || '📦') +
          '</span><span>' + esc(c) + '<small>' + counts[c] + '</small></span></button>';
      }).join('') + '</div>' +
      '<button class="btn quiet" data-act="go" data-to="bulk">Adding lots of books? Add many at once</button>';
  }
  var r = RMSearch.search(S.groups, RMIsbn.clean(q) || q);   // an ISBN typed with dashes or as ISBN-10 still finds the book
  if (!r.strong.length) {
    return '<div class="card empty" style="margin-top:14px"><h2>Nothing called “' + esc(q) + '” on the list.</h2>' +
      '<p>Check the spelling, or try the word in another language.</p>' +
      '<button class="btn primary" data-act="toRequest">Ask to buy it</button>' +
      '<button class="btn quiet" data-act="toAdd">We have it. Add it to the list</button></div>' +
      (r.weak.length ? '<p class="count">Closest things on the list:</p><div class="list">' + r.weak.map(card).join('') + '</div>' : '');
  }
  var shown = r.strong.slice(0, 30);
  return '<p class="count">' + (r.strong.length === 1 ? 'Yes, we have this:' : 'We have ' + r.strong.length + ' things like this:') + '</p>' +
    '<div class="list">' + shown.map(card).join('') + '</div>' +
    (r.strong.length > shown.length ? '<p class="hint">Showing the first 30. Type more to narrow it down.</p>' : '') +
    '<div class="after"><p>None of these?</p>' +
    '<button class="btn" data-act="toRequest">Ask to buy something new</button>' +
    '<button class="btn quiet" data-act="toAdd">We have it, but it’s not on the list</button></div>';
}
function card(g) {
  var mine = myCentre(), places;
  if (g.rows.length === 1) {
    var r = g.rows[0];
    places = '<span class="pl' + (low(r) ? ' low' : '') + (r.centre === mine ? ' mine' : '') + '">' + esc(r.centre) + ' · ' +
      esc(r.loc) + ' <b>' + qtyText(r) + '</b></span>';
  } else {
    var per = {}, names = [];
    g.rows.forEach(function (r) {
      if (!per[r.centre]) { per[r.centre] = { qty: 0, lv: null, low: false }; names.push(r.centre); }
      if (isLevel(r)) per[r.centre].lv = per[r.centre].lv === null ? r.qty : Math.min(per[r.centre].lv, r.qty);
      else per[r.centre].qty += r.qty;
      if (low(r)) per[r.centre].low = true;
    });
    places = names.map(function (c) {
      return '<span class="pl' + (per[c].low ? ' low' : '') + (c === mine ? ' mine' : '') + '">' + esc(c) + ' <b>' + (per[c].lv !== null && !per[c].qty ? LEVEL_NAMES[per[c].lv] : per[c].qty) + '</b></span>';
    }).join('');
  }
  var flags = '';
  g.rows.forEach(function (r) {
    if (STATUS_LABEL[r.status] && flags.indexOf(STATUS_LABEL[r.status]) < 0) flags += ' <span class="badge warn">' + STATUS_LABEL[r.status] + '</span>';
  });
  return '<button class="card item" data-act="open" data-key="' + esc(g.key) + '">' + tile(g.photoRow, g.cat) +
    '<span class="body"><span class="name">' + esc(g.name) + '</span>' +
    (g.alt ? '<span class="alt">' + esc(g.alt) + '</span>' : '') +
    '<span class="line"><b>' + groupSummary(g) + '</b>' + (g.rows.length > 1 ? ' in ' + g.rows.length + ' places' : '') + flags + '</span>' +
    '<span class="places">' + places + '</span></span></button>';
}

function histLine(h) {

// ----- Running low -----
// who else has plenty of it
function spareOf(it) {
  return (S.gmap[RMSearch.norm(it.name)] || { rows: [] }).rows.filter(function (r) {
    return r.centre !== it.centre && (isLevel(r) ? r.qty === 3 : r.qty > r.min);
  });
}
// the list as a WhatsApp message: what is low, who has spare, and what is broken
function shoppingText(lows, broken, scopeLabel) {
  var day = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  var lines = ['Running low at ' + scopeLabel + ' (' + day + '):'];
  lows.slice(0, 25).forEach(function (it) {
    var spare = spareOf(it);
    lines.push('• ' + it.name + ' (' + it.centre + '): ' +
      (isLevel(it) ? LEVEL_NAMES[it.qty] : amount(it.qty, it.unit) + ' left, need at least ' + it.min) +
      (spare.length ? '. ' + spare.map(function (r) { return r.centre + ' has ' + qtyText(r); }).join(', ') : ''));
  });
  if (lows.length > 25) lines.push('…and ' + (lows.length - 25) + ' more. Open the app for the rest.');
  if (broken.length) {
    lines.push('', 'Broken or missing pieces:');
    broken.slice(0, 10).forEach(function (it) { lines.push('• ' + it.name + ' (' + it.centre + '): ' + STATUS_LABEL[it.status].toLowerCase()); });
  }
  return lines.join('\n');
}
function vLow() {
  var mine = myCentre();
  var scope = function (it) { return S.lowAll || it.centre === mine; };
  var lows = S.items.filter(function (it) { return scope(it) && low(it); })
    .sort(function (a, b) { return (a.centre === mine ? 0 : 1) - (b.centre === mine ? 0 : 1) || a.centre.localeCompare(b.centre) || a.name.localeCompare(b.name); });
  var broken = S.items.filter(function (it) { return scope(it) && STATUS_LABEL[it.status]; });
  var row = function (it, extra) {
    return '<button class="card item" data-act="open" data-key="' + esc(RMSearch.norm(it.name)) + '" data-id="' + esc(it.id) + '">' +
      tile(it, it.cat) + '<span class="body"><span class="name">' + esc(it.name) + '</span>' + extra +
      '<span class="line">' + esc(it.centre) + ' · ' + esc(it.loc) + '</span></span></button>';
  };
  return top(false) + '<h1 class="title">Running low</h1>' +
    '<div class="seg" data-group="lowAll">' +
    '<button class="chip' + (S.lowAll ? '' : ' on') + '" data-act="lowScope" data-val="">' + esc(mine || 'My centre') + '</button>' +
    '<button class="chip' + (S.lowAll ? ' on' : '') + '" data-act="lowScope" data-val="1">All centres</button></div>' +
    (lows.length || broken.length ? '<a class="btn" id="share" target="_blank" rel="noopener" href="https://wa.me/?text=' +
      encodeURIComponent(shoppingText(lows, broken, S.lowAll ? 'all centres' : (mine || 'my centre'))) + '">Send this list on WhatsApp</a>' : '') +
    (lows.length ? '<div class="list">' + lows.map(function (it) {
      var spare = spareOf(it);
      return row(it, (isLevel(it)
        ? '<span class="line"><span class="badge low">' + LEVEL_NAMES[it.qty] + '</span> running out</span>'
        : '<span class="line"><span class="badge low">' + amount(it.qty, it.unit) + ' left</span> need at least ' + it.min + '</span>') +
        (spare.length ? '<span class="line"><span class="badge ok">' + spare.map(function (r) { return esc(r.centre) + ' has ' + qtyText(r); }).join(' · ') + '</span></span>' : ''));
    }).join('') + '</div>' : '<div class="card empty"><h2>Nothing is running low.</h2><p style="margin:0">Everything here is above its minimum.</p></div>') +
    (broken.length ? '<h2 class="sec">Broken or missing pieces</h2><div class="list">' + broken.map(function (it) {
      return row(it, '<span class="line"><span class="badge warn">' + STATUS_LABEL[it.status] + '</span>' + (it.notes ? ' ' + esc(it.notes) : '') + '</span>');
    }).join('') + '</div>' : '');
}

// ----- Count -----
function vCount(v) {
  var centre = v.centre || myCentre() || S.centres[0];
  v.centre = centre;
  var places = {}, names = [];
  S.items.forEach(function (it) {
    if (it.centre !== centre) return;
    if (!places[it.loc]) { places[it.loc] = { n: 0, oldest: Infinity }; names.push(it.loc); }
    places[it.loc].n++;
    places[it.loc].oldest = Math.min(places[it.loc].oldest, it.counted || 0);
  });
  names.sort(function (a, b) { return places[a].oldest - places[b].oldest; });
  return top(false) + '<h1 class="title">Count a shelf</h1><p class="sub">Pick a place, check the numbers, save. Two minutes.</p>' +
    '<div class="seg" data-group="countCentre">' + S.centres.map(function (c) {
      return '<button class="chip' + (c === centre ? ' on' : '') + '" data-act="countCentre" data-val="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</div>' +
    (names.length ? '<div class="card">' + names.map(function (loc) {
      var p = places[loc], days = p.oldest ? Math.floor((Date.now() - p.oldest) / 86400000) : 999;
      return '<button class="rowbtn" data-act="countPlace" data-val="' + esc(loc) + '"><span>' + esc(loc) +
        '<small>' + p.n + (p.n === 1 ? ' thing' : ' things') + ' · counted ' + ago(p.oldest) + '</small></span>' +
        (days > 30 ? '<span class="badge warn">Due</span>' : '') + ICON.go + '</button>';
    }).join('') + '</div>' : '<div class="card empty"><h2>Nothing is listed at this centre yet.</h2></div>');
}
function vCountList(v) {
  var rows = S.items.filter(function (it) { return it.centre === v.centre && it.loc === v.loc; })
    .sort(function (a, b) { return a.name.localeCompare(b.name); });
  F = { was: {} };
  rows.forEach(function (it) { F.was[it.id] = it.qty; });

function countChanges() {

// Title from Open Library (free). If it is not reachable or does not know the book, the person types the title.
function lookupTitle(isbn) {
  return new Promise(function (resolve) {
    var done = false, timer = setTimeout(function () { if (!done) { done = true; resolve({ error: true }); } }, 8000);
    function finish(v) { if (done) return; done = true; clearTimeout(timer); resolve(v); }
    try {
      fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data')
        .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
        .then(function (j) {
          var b = j && j['ISBN:' + isbn];
          finish(b && b.title ? { title: String(b.title) + (b.subtitle ? ': ' + b.subtitle : '') } : { missing: true });
        })
        .catch(function () { finish({ error: true }); });
    } catch (e) { finish({ error: true }); }
  });
}

var toastTimer = 0, toastFn = null;

  var t = byIdEl('toast');

  t.hidden = false;
  clearTimeout(toastTimer);

// ---------- forms ----------
function val(id) { var el = byIdEl(id); return el ? el.value.trim() : ''; }
function formError(msg) {
  var e = byIdEl('f-err');
  if (e) { e.textContent = msg; e.hidden = !msg; if (msg) e.scrollIntoView({ block: 'center' }); }
  else if (msg) toast(msg);
}
function busy(on, label) {
  var b = byIdEl('f-go') || byIdEl('m-go');
  if (!b) return;
  if (on) { b.dataset.label = b.textContent; b.textContent = label || 'Saving…'; b.disabled = true; }
  else { b.textContent = b.dataset.label || b.textContent; b.disabled = false; }
}
function failed(e) {
  busy(false);
  formError(e.network ? 'No signal. Try again when you’re back on Wi-Fi.' : e.message);
}
function shrink(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 900 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('photo')); };
    img.src = url;
  });
}

  isbnLook: function (el) {
    var i = Number(el.dataset.i), row = F.rows[i];
    var isbn = RMIsbn.clean(row.isbn);
    if (isbn === '') return setRowMsg(i, 'Type the ISBN first.');
    if (isbn === null) return setRowMsg(i, 'The ISBN looks wrong. Check the digits.');

    lookupTitle(isbn).then(function (res) {

  bulkGo: function () {
    var loc = val('f-loc');
    if (!F.centre) return formError('Choose which centre it is at.');
    if (!loc) return formError('Type where they are kept.');
    var rows = [], map = [], bad = false;
    F.rows.forEach(function (r, i) {
      r.err = '';
      var name = String(r.name || '').trim(), typedIsbn = String(r.isbn || '').trim(), isbn = RMIsbn.clean(r.isbn), q = parseQty(r.qty);
      if (!name && !typedIsbn) return;                                     // an empty line is not a mistake
      if (isbn === null) { r.err = 'The ISBN looks wrong. Check the digits.'; bad = true; return; }
      if (isNaN(q) || q < 1) { r.err = 'Copies must be 1 or more.'; bad = true; return; }
      if (!name && !listHasIsbn(isbn)) { r.err = 'Type the title. This ISBN is not on the list yet.'; bad = true; return; }
      rows.push({ name: name, isbn: isbn, qty: q });
      map.push(i);
    });
    if (bad) { drawRows(); return formError('Fix the lines marked in red.'); }
    if (!rows.length) return formError('Add at least one book or item.');
    formError('');
    busy(true);
    call('addMany', { centre: F.centre, location: loc, unit: val('f-unit'), cat: F.cat || '', rows: rows, actionId: uid() }).then(function (res) {
      mergeItems(res.items); rebuild();
      if (res.problems && res.problems.length) {
        var errs = {};
        res.problems.forEach(function (p) { errs[map[p.row]] = p.error; });
        // keep only the lines that failed, in their old order, each with its own message
        var failedAt = Object.keys(errs).map(Number).sort(function (a, b) { return a - b; });
        F.rows = failedAt.map(function (i) { var r = F.rows[i]; r.err = errs[i]; return r; });
        drawRows();
        busy(false);
        return formError('Saved ' + (res.created + res.topped) + '. The lines below need a fix.');
      }
      root('home');
      toast(res.replay ? 'Already saved.' : 'Added ' + res.created + (res.created === 1 ? ' new item' : ' new items') +
        (res.topped ? ' and more copies of ' + res.topped + ' already listed' : '') + '.');
    }).catch(failed);
  },
  connect: function () {
    var id = parseBackend(val('s-link')), err = byIdEl('s-err');
    if (!id) { err.textContent = 'That does not look like the list’s link. Ask your admin to send it again.'; err.hidden = false; return; }
    store.set('rm_backend', id);
    setBackend(id);
    S.failed = false;
    render();
    refresh();
  },
  labelOpt: function (el) {
    var v = cur();
    v[el.dataset.k] = el.dataset.val;
    if (el.dataset.k === 'centre') v.place = '';
    render();
  },
  print: function () {
    try { window.print(); } catch (e) { toast('Press Ctrl+P (or the browser menu, then Print).'); }
  },
  setLevel: function (el) {
    var it = S.byId[cur().id], n = Number(el.dataset.n);
    if (!it || !isLevel(it) || it.qty === n) return;
    var id = it.id, was = it.qty;
    enqueue('setLevel', { itemId: id, level: n });
    softRender();
    toast('Set to ' + LEVEL_NAMES[n] + '.', 'Undo', function () {
      enqueue('setLevel', { itemId: id, level: was });
      softRender();
      toast('Undone.');
    });
  },
  countLevel: function (el) {
    var input = byIdEl(el.dataset.for);
    input.value = el.dataset.n;
    el.parentNode.querySelectorAll('.lvl').forEach(function (b) { b.classList.toggle('on', b === el); });
    input.dispatchEvent(new Event('input', { bubbles: true }));
  },
  chip: function (el) {
    var box = el.parentNode, group = box.dataset.group, v = el.dataset.val;
    F[group] = F[group] === v && group === 'cat' ? '' : v;
    box.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c.dataset.val === F[group]); });
    if (group === 'tracking') syncTrack();
    if (group === 'centre' && byIdEl('f-locs')) byIdEl('f-locs').innerHTML = locChips(F.centre);
  },
  locPick: function (el) { byIdEl('f-loc').value = el.dataset.val; },
  photo: function () { byIdEl('file').value = ''; byIdEl('file').click(); },

  addGo: function () {
    var name = val('f-name'), qty = parseQty(val('f-qty')), loc = val('f-loc'), min = val('f-min'), lv = levelOn();
    if (!name) return formError('Type what it is.');
    if (!lv && isNaN(qty)) return formError('Type how many there are, as a number.');
    if (!F.centre) return formError('Choose which centre it is at.');
    if (!loc) return formError('Type where it is kept.');
    if (!lv && min && isNaN(parseQty(min))) return formError('“Keep at least” must be a number.');
    var g = S.gmap[RMSearch.norm(name)] || {};   // same name as something we have: keep its details the same
    // the minimum is copied to a new centre, but not to a second shelf in a centre that already has one
    var here = (g.rows || []).some(function (r) { return r.centre === F.centre; });
    formError('');
    busy(true);
    var photo = F.photo;
    call('addItem', {
      name: g.name || name, qty: lv ? '' : qty, centre: F.centre, location: loc, unit: lv ? '' : (val('f-unit') || g.unit || ''),
      alt: val('f-alt') || g.alt || '', cat: F.cat || g.cat || '', min: lv ? '' : (min || (g.min && !here ? g.min : '')), notes: val('f-notes'),
      tracking: lv ? 'Level' : '', level: lv ? Math.max(0, LEVEL_NAMES.indexOf(F.level)) : '',
      photoData: photo
    }).then(function (res) {
      var it = res.items[0];
      if (photo && !res.photoFailed) S.localPhoto[it.id] = photo;
      mergeItems(res.items); rebuild();
      S.stack = [{ name: 'home' }]; S.q = '';
      go({ name: 'item', key: RMSearch.norm(it.name), id: it.id });
      toast(res.photoFailed ? 'Added, but the photo could not be saved.' : 'Added to the list.');
    }).catch(function (e) {
      if (e.data && e.data.duplicateId && S.byId[e.data.duplicateId]) {
        var d = S.byId[e.data.duplicateId];
        S.stack = [{ name: 'home' }];
        go({ name: 'item', key: RMSearch.norm(d.name), id: d.id });
        return toast('That’s already on the list here. Use “Add stock”.');
      }
      failed(e);
    });
  },
  requestGo: function () {
    var v = cur(), name = val('f-name'), qty = parseQty(val('f-qty')), price = val('f-price').replace(',', '.');
    if (!name) return formError('Type what you need.');
    if (!(qty >= 1)) return formError('Type how many you need, as a number.');
    if (!F.centre) return formError('Choose which centre it is for.');
    if (price && !/^\d+(\.\d{1,2})?$/.test(price)) return formError('Type the price as a number, like 45 or 12.50.');
    formError('');
    busy(true, 'Sending…');
    var data = { name: name, qty: qty, unit: val('f-unit'), centre: F.centre, why: val('f-why'), price: price, itemId: v.itemId || '' };
    call('addRequest', data).then(function (res) {
      S.requests = null;
      root('home');
      var text = 'Request to buy: ' + qty + ' ' + (data.unit || 'pcs') + ' of ' + name + ' for ' + F.centre +
        (data.why ? '. Why: ' + data.why : '') + (price ? '. About RM ' + price : '') + ' (' + res.id + ')';
      openSheet('<h2>Request sent</h2><p class="sub">It’s on the list for a decision. You can check it under Me → Requests to buy.</p>' +
        '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(text) + '">Also send it on WhatsApp</a>' +
        '<button class="btn primary" data-act="closeSheet">Done</button>');
    }).catch(failed);
  },
  editGo: function () {
    var it = S.byId[cur().id];
    if (!it) return;
    var f = {}, loc = val('f-loc'), photo = F.photo;
    if (!loc) return formError('Type where it is kept.');
    if (loc !== it.loc) f.loc = loc;
    if (val('f-notes') !== it.notes) f.notes = val('f-notes');
    if (S.admin) {
      var min = val('f-min');
      if (!val('f-name')) return formError('The item needs a name.');
      if (!isLevel(it) && min && isNaN(parseQty(min))) return formError('“Keep at least” must be a number.');
      if (val('f-name') !== it.name) f.name = val('f-name');
      if (val('f-alt') !== it.alt) f.alt = val('f-alt');
      if (F.cat !== it.cat) f.cat = F.cat;
      if (F.centre !== it.centre) f.centre = F.centre;
      if (!isLevel(it) && (val('f-unit') || 'pcs') !== it.unit) f.unit = val('f-unit');
      if (!isLevel(it) && (parseQty(min) || 0) !== it.min) f.min = parseQty(min) || 0;
      if (!isLevel(it) && F.tracking === 'Just the level') f.tracking = 'Level';
    }
    if (!Object.keys(f).length && !photo) return back();
    formError('');
    busy(true);
    call('updateItem', { itemId: it.id, fields: f, photoData: photo, pin: S.pin }).then(function (res) {
      var n = res.items[0];
      if (photo && !res.photoFailed) S.localPhoto[n.id] = photo;
      mergeItems(res.items); rebuild();
      S.stack.pop();
      S.stack[S.stack.length - 1] = { name: 'item', key: RMSearch.norm(n.name), id: n.id };
      render();
      toast(res.photoFailed ? 'Saved, but the photo could not be saved.' : 'Saved.');
    }).catch(failed);
  },

  lowScope: function (el) { S.lowAll = !!el.dataset.val; render(); },
  countCentre: function (el) { cur().centre = el.dataset.val; render(); },
  countPlace: function (el) { go({ name: 'countList', centre: cur().centre, loc: el.dataset.val }); },
  countGo: function () {
    var v = cur(), changes = countChanges();
    if (!changes) return;
    enqueue('saveCount', { centre: v.centre, location: v.loc, counts: changes });
    S.stack.pop();
    render();
    toast(changes.length ? 'Count saved. ' + changes.length + ' corrected.' : 'Count saved. All correct.');
  },

  pickCentre: function (el) {
    S.me = { centre: el.dataset.val };
    store.set('rm_me', S.me);
    root('home');
    applyLink();
  },
  myCentre: function (el) { S.me = { centre: el.dataset.val }; store.set('rm_me', S.me); render(); },

  pinOpen: function () {
    M = { type: 'pin' };
    openSheet('<h2>Admin PIN</h2><p class="sub">It’s in the Setup tab of the Google Sheet.</p>' +
      '<input id="m-pin" class="inp" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="Admin PIN">' +
      '<p class="err" id="m-err" hidden></p>' +
      '<button class="btn primary" id="m-go" data-act="pinGo">Continue</button><button class="btn quiet" data-act="closeSheet">Cancel</button>', 'm-pin');
  },
  pinGo: function () {
    var pin = val('m-pin');
    if (!pin) return;
    busy(true, 'Checking…');
    call('adminOpen', { pin: pin }).then(function (res) {
      S.admin = { sheetUrl: res.sheetUrl, log: res.log };
      S.pin = pin;
      closeSheet();
      go({ name: 'admin' });
    }).catch(function (e) {
      busy(false);
      var err = byIdEl('m-err');
      err.textContent = e.network ? 'No signal. Try again.' : e.message;
      err.hidden = false;
    });
  },
  adminLeave: function () { S.admin = null; S.pin = ''; root('more'); },
  decide: function (el) {
    M = { type: 'decide', id: el.dataset.id, status: el.dataset.val };
    var label = { Approved: 'Approve this request?', Declined: 'Decline this request?', Bought: 'Mark as bought?' }[M.status];
    openSheet('<h2>' + label + '</h2>' +
      '<label class="lab" for="m-note">Note for the person who asked <i>(optional)</i></label>' +
      '<input id="m-note" class="inp" maxlength="200" autocomplete="off" placeholder="' + (M.status === 'Declined' ? 'e.g. another centre has spare, collect from them' : '') + '">' +
      '<button class="btn primary" id="m-go" data-act="decideGo">Yes</button><button class="btn quiet" data-act="closeSheet">Cancel</button>');
  },
  decideGo: function () {
    busy(true);
    call('decideRequest', { id: M.id, status: M.status, note: val('m-note'), pin: S.pin }).then(function () {
      closeSheet();
      loadRequests();
      toast('Saved.');
    }).catch(function (e) { busy(false); toast(e.network ? 'No signal. Try again.' : e.message); });
  }
};
function loadRequests() {
  call('getRequests', {}).then(function (res) { S.requests = res.requests; if (cur().name === 'requests') render(); })
    .catch(function (e) { if (cur().name === 'requests') toast(e.network ? 'No signal.' : e.message); });
}

// ---------- listeners ----------
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  // the next tap anywhere puts the last message away, so it never sits on top of a button
  if (!e.target.closest('#toast')) byIdEl('toast').hidden = true;
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName !== 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') { S.q = t.value; drawResults(); }
  else if (t.id === 'm-n') { if (M.type === 'move') refreshMove(); else updateStockBtn(); }
  else if (t.id === 'f-name' && !t.readOnly && byIdEl('similar')) byIdEl('similar').innerHTML = similarHtml(t.value);
  else if (t.id && t.id.indexOf('c-') === 0) countChanges();
  else if (t.id && /^b-(isbn|name|qty)-\d+$/.test(t.id)) {
    var m = /^b-(isbn|name|qty)-(\d+)$/.exec(t.id);
    if (F.rows && F.rows[m[2]]) F.rows[m[2]][m[1]] = t.value;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'q') e.target.blur();
  if (e.key === 'Enter' && e.target.id === 'm-pin') ACT.pinGo();
  if (e.key === 'Escape' && !byIdEl('sheet').hidden) closeSheet();
});
// a photo that will not load falls back to the Drive thumbnail, then to the picture of its category
document.addEventListener('error', function (e) {
  var t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  if (t.dataset.fb) { var fb = t.dataset.fb; delete t.dataset.fb; t.src = fb; }
  else t.remove();
}, true);
// Barcode scanning only where the browser can do it (Chrome on Android). Elsewhere the person types the ISBN.
byIdEl('scan').addEventListener('change', function () {
  var file = this.files && this.files[0], i = F.scanFor;
  if (!file || !('BarcodeDetector' in window) || !F.rows || !F.rows[i]) return;
  createImageBitmap(file).then(function (bmp) { return new BarcodeDetector({ formats: ['ean_13', 'ean_8'] }).detect(bmp); })
    .then(function (codes) {
      var isbn = RMIsbn.clean(codes && codes[0] && codes[0].rawValue);
      if (!isbn) return setRowMsg(i, 'Could not read that barcode. Try again, or type the ISBN.');
      F.rows[i].isbn = isbn;
      var el = byIdEl('b-isbn-' + i);
      if (el) el.value = isbn;
      ACT.isbnLook({ dataset: { i: String(i) } });
    }).catch(function () { setRowMsg(i, 'Could not read that barcode. Try again, or type the ISBN.'); });
});
byIdEl('file').addEventListener('change', function () {
  var f = this.files && this.files[0];
  if (!f) return;
  shrink(f).then(function (dataUrl) {
    F.photo = dataUrl;
    var th = byIdEl('f-thumb');
    if (th) th.innerHTML = '<span class="tile"><img alt="" src="' + dataUrl + '"></span>';
  }).catch(function () { toast('That photo could not be used. Try another one.'); });
});
window.addEventListener('online', function () { flush(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Date.now() - S.syncedAt > 120000) refresh();
});

// ---------- start ----------
// a phone that stored a name from an earlier version forgets it
if (S.me && S.me.name !== undefined) { S.me = { centre: S.me.centre }; store.set('rm_me', S.me); }
if (HOSTED) {
  var given = parseBackend(location.hash), known = given || parseBackend(store.get('rm_backend', ''));
  if (given) {
    store.set('rm_backend', given);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* the code stays in the address bar */ }
  }
  if (known) setBackend(known);
  // installable and usable without signal: the page's own files are kept by the browser
  [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icon-192.png']].forEach(function (p) {
    var link = document.createElement('link');
    link.rel = p[0]; link.href = p[1];
    document.head.appendChild(link);
  });
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* works without it */ }); } catch (e) { /* works without it */ }
}
var cached = store.get('rm_data', null);
if (cached && cached.staff) { delete cached.staff; store.set('rm_data', cached); }
if (cached && cached.items) applyData(cached);
render();
refresh();
// a QR sticker opens the app with ?i=ITEM-ID (an item) or ?c=CENTRE&p=PLACE (a shelf to count)
if (HOSTED) {
  try {
    var q = new URLSearchParams(location.search), found = {};
    ['i', 'c', 'p'].forEach(function (k) { if (q.get(k)) found[k] = q.get(k); });
    if (found.i || (found.c && found.p)) {
      pendingLink = found;
      history.replaceState(null, '', location.pathname);   // a reload should not open it again
      applyLink();
    }
  } catch (e) { /* no link support */ }
} else {
  try { google.script.url.getLocation(function (loc) { pendingLink = (loc && loc.parameter) || null; applyLink(); }); } catch (e) { /* no link support */ }
}
})();
</script>
</body>
</html>
